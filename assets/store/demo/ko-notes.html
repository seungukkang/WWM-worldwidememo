<p>각 토큰은 query, key, value로 투영된다.</p>
<p>query와 key를 비교해 점수를 구하고, 그 점수로 value를 섞는다.</p>
<p>여러 head가 병렬로 동작하며, 각각 다른 종류의 관계에 집중할 수 있다.</p>
