<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WWM</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <img src="../icons/icon-32.png" alt="" width="20" height="20" />
      <h1>WorldWideMemo</h1>
      <div class="history">
        <button id="undo" class="icon" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5L4 9l4 4M4 9h8a4 4 0 0 1 0 8h-2" /></svg>
        </button>
        <button id="redo" class="icon" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5l4 4-4 4M16 9H8a4 4 0 0 0 0 8h2" /></svg>
        </button>
        <button id="settings-toggle" class="icon" aria-expanded="false" aria-controls="settings" data-i18n-title="settingsTitle">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M8.58 3.86 L8.83 1.68 L11.17 1.68 L11.42 3.86 L13.34 4.66 L15.06 3.29 L16.71 4.94 L15.34 6.66 L16.14 8.58 L18.32 8.83 L18.32 11.17 L16.14 11.42 L15.34 13.34 L16.71 15.06 L15.06 16.71 L13.34 15.34 L11.42 16.14 L11.17 18.32 L8.83 18.32 L8.58 16.14 L6.66 15.34 L4.94 16.71 L3.29 15.06 L4.66 13.34 L3.86 11.42 L1.68 11.17 L1.68 8.83 L3.86 8.58 L4.66 6.66 L3.29 4.94 L4.94 3.29 L6.66 4.66Z" />
            <circle cx="10" cy="10" r="2.6" />
          </svg>
        </button>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="page" aria-selected="true" data-i18n="tabThisPage">This page</button>
        <button role="tab" data-tab="all" aria-selected="false" data-i18n="tabAll">All</button>
      </nav>
    </header>

    <section id="stylebar" class="stylebar" aria-live="polite"></section>

    <section id="settings" class="settings" hidden>
      <h2 data-i18n="settingsToolbar">Toolbar</h2>
      <label class="field">
        <span data-i18n="toolbarModeLabel">When text is selected</span>
        <select id="set-mode">
          <option value="full" data-i18n="toolbarModeFull">Floating toolbar on the page</option>
          <option value="compact" data-i18n="toolbarModeCompact">Small icon on the page</option>
          <option value="panel" data-i18n="toolbarModePanel">Side panel only</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="toolbarPlacementLabel">Position</span>
        <select id="set-placement">
          <option value="above" data-i18n="placementAbove">Above the selection</option>
          <option value="below" data-i18n="placementBelow">Below the selection</option>
        </select>
      </label>
      <label class="field">
        <span><span data-i18n="toolbarOpacityLabel">Opacity</span> <output id="set-opacity-value"></output></span>
        <input id="set-opacity" type="range" min="50" max="100" step="10" />
      </label>
    </section>

    <section id="banner" class="banner" hidden></section>

    <main>
      <section id="tab-page" role="tabpanel">
        <p id="page-title" class="page-title"></p>
        <div id="page-labels" class="page-labels" hidden></div>
        <ul id="page-list" class="list"></ul>
        <details id="orphans" class="orphans" hidden>
          <summary><span data-i18n="orphansHeading">Annotations not found</span> <span id="orphan-count"></span></summary>
          <ul id="orphan-list" class="list"></ul>
        </details>
      </section>
      <section id="tab-all" role="tabpanel" hidden>
        <input id="library-search" class="search" type="search" autocomplete="off" />
        <div id="library-chips" class="chips"></div>
        <div id="library-filters" class="chips filters"></div>
        <div id="label-manage" hidden></div>
        <ul id="all-list" class="list"></ul>
      </section>
    </main>

    <footer class="bottom">
      <button id="export" data-i18n="exportJson">Export JSON</button>
      <span class="version" id="version"></span>
    </footer>
    <div id="panel-toast" class="panel-toast" role="status" hidden></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
